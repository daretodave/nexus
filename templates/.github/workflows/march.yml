name: march

# Cloud half of the autonomous loop. One scheduled invocation =
# one /march tick. State of truth is the repo on origin/<DEFAULT_BRANCH>;
# every tick reads it fresh, no memory between runs.
#
# See .github/CLOUD_LOOP.md for setup, debugging, and the upgrade path
# from bot-author to user-author.
#
# Two ways to land, switched by the repo variable NEXUS_LOOP_MODE
# (the cloud's .owner; nexus/playbooks/owner-mode.md):
#   owner   the `owner` job: the tick works as the owner's checkout
#           does - claims, settles, pushes <DEFAULT_BRANCH>. Its safety
#           is the gate (and the ruleset bypass its token holds).
#   unset   pull-request mode, the jobs after it: `pick` claims one
#   or pr   chunk as cloud-<run id>; `build` runs /next on it with no
#           token at all, on the branch nexus/<run id>, plan changes
#           only as pending files; `land` fences the diff, then
#           pushes and opens the PR (with an app token when
#           NEXUS_APP_ID is set); `release` drops the claim when
#           nothing landed. pr-flow.yml releases a PR'd claim when
#           the PR closes; pr-resolve.yml keeps loop PRs mergeable.
# Every job runs on GitHub-hosted runners (they hold secrets), and no
# secret sits in run-name or a job's env (scripts/workflow-lint.mjs).

on:
  schedule:
    # Every 2h, off-peak UTC. Adjust to match your timezone — GH cron
    # always runs in UTC. The example below = ~7 ticks/day, weighted
    # toward 22:00-12:00 UTC (US East off-peak).
    - cron: '0 1,3,5,7,9,11,23 * * *'
  workflow_dispatch:
    inputs:
      verb:
        description: 'Concierge lane: run this verb instead of dispatching (owner mode; pull-request mode builds one chunk on march or next, nothing on another verb)'
        required: false
        type: choice
        default: march
        options: [march, next, critique, iterate, ship-a-chunk, ship-data, expand, triage, digest]
      chunk:
        description: 'Pull-request mode: build this chunk id (empty: the next ready one)'
        required: false
        type: string
        default: ''

concurrency:
  # Serialize ticks. A long-running tick blocks the next scheduled
  # firing rather than racing the working tree. Acceptable.
  group: march
  cancel-in-progress: false

jobs:
  # ═════════════════════════════════════════════════════════════
  # Owner mode (NEXUS_LOOP_MODE = owner): one job, pushes main.
  # ═════════════════════════════════════════════════════════════
  owner:
    if: vars.NEXUS_LOOP_MODE == 'owner'
    runs-on: ubuntu-latest
    # 6h is the GH-Actions hard limit; 5h leaves headroom. Most ticks
    # finish in under 15min; the long tail is /ship-a-chunk doing a
    # full prerendered build.
    timeout-minutes: 300
    permissions:
      contents: write   # push back to <DEFAULT_BRANCH>
      issues: write     # /triage labels + cloud-failed issue
      id-token: write   # Claude Code Action's OIDC handshake
    steps:
      - name: Checkout (full history for /march dispatch)
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default: GITHUB_TOKEN (commits as github-actions[bot]).
          # To switch to user-author mode, mint a fine-grained PAT
          # scoped to this repo with Contents:write + Issues:write,
          # add it as ACTIONS_PAT secret, and uncomment the next line:
          # token: ${{ secrets.ACTIONS_PAT }}

      # The project's toolchain: .github/actions/setup/action.yml
      # (one place, shared with the pull-request build job).
      - name: Project toolchain
        uses: ./.github/actions/setup

      # ───────────────────────────────────────────────────────────
      # Cloud-loop control plane.
      # ───────────────────────────────────────────────────────────

      - name: Daily commit ceiling check
        id: ceiling
        run: |
          # Cloud commits are identified by the `Cloud-Run:` trailer
          # the agent appends to every commit message (the brief
          # mandates it). The ceiling bounds *cloud volume* in 24h —
          # local commits don't count toward it.
          #
          # The count is weighted, not flat: a chunk-shipping commit
          # (ship-a-chunk — code, tests, a closed chunk) costs more
          # runway than a churn commit (iterate/critique/triage/digest
          # — one finding, one file). Discriminator: does the commit
          # add a line to plan/ARCHIVE.md? That's the one thing only
          # a chunk close (ship-a-chunk Step 9.5) does.
          #
          # `ceiling=12` below is the literal default; `/bootstrap
          # cloud-loop` (templates/scripts/bootstrap.mjs install-
          # workflow) overwrites this line with your manifest's
          # cloud_loop.daily_ceiling when it installs this file. Hand-
          # editing it (like the cron line above) works too.
          since="$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S')"
          ceiling=12
          budget=0
          for sha in $(git log --since="$since" --grep='Cloud-Run:' --format='%H'); do
            if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qx 'plan/ARCHIVE.md' \
               && git show "$sha" -- plan/ARCHIVE.md | grep -q '^+- '; then
              budget=$((budget + 3))   # chunk-shipping commit
            else
              budget=$((budget + 1))   # churn commit
            fi
          done
          echo "Cloud-shipped weighted budget in last 24h: $budget / $ceiling (chunk=3, churn=1)"
          if [ "$budget" -ge "$ceiling" ]; then
            echo "Cloud ceiling reached ($ceiling weighted budget/24h). Exiting cleanly — no work this tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The quota governor (scripts/cloud/quota.mjs): every loop on
      # your Claude subscription shares one seven_day window. The
      # newest reading any march or night run cached comes back first.
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      # Skips the model (a clean exit) while the pause issue's reset
      # is ahead, or, for a scheduled or chained tick, when the cached
      # utilization is at or above the repo variable NEXUS_QUOTA_MAX
      # (default 0.90; `off` disables that soft cap). Nudge, loop:do
      # and hand-dispatched runs ignore the soft cap. Fails open.
      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.90' }}
        run: |
          grep -qx '.nexus/' .git/info/exclude 2>/dev/null || echo '.nexus/' >> .git/info/exclude
          node scripts/cloud/quota.mjs gate --event "$EVENT" --reason "$REASON" --max "$QUOTA_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # Git author identity is set via GIT_AUTHOR_* /
      # GIT_COMMITTER_* env vars on the action step below, NOT via
      # `git config`: the action runs its own internal git config
      # after workflow steps, so repo-local config gets silently
      # overridden. Env vars win at commit time. Leave them unset
      # for bot-author mode (the action's own default); set them
      # to switch to user-author mode — see CLOUD_LOOP.md
      # "Identity choice".

      # The runner's checkout is the owner's for this tick: an
      # untracked .owner makes scripts/claims.mjs claim as the
      # owner, scripts/plan/settle.mjs settle and the push policy
      # pass <DEFAULT_BRANCH> (nexus/playbooks/owner-mode.md).
      - name: Owner mode for this checkout
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        # .git/info/exclude too, so a repo whose .gitignore lacks it
        # never commits the marker.
        run: touch .owner && echo .owner >> .git/info/exclude

      - name: Run /march (cloud mode)
        id: run_march
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Default: OAuth token against your Claude Pro/Max
          # subscription. $0 marginal cost; quota shared with local.
          # Alternative: ANTHROPIC_API_KEY env var (pay-per-token).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet for cheap-on-quota dispatch. Upgrade to
          # claude-opus-5-5 once you've measured a week of weekly-cap
          # consumption and confirmed headroom.
          #
          # --permission-mode bypassPermissions is REQUIRED here:
          # the runner has no human to approve permission prompts,
          # and default mode silently starves the tick ("This
          # command requires approval" - the loop reads everything,
          # ships nothing). This is the disposable-container context
          # that customization/claude-code.md sanctions for bypass:
          # the runner is ephemeral, the GITHUB_TOKEN is repo-scoped,
          # and the guard hooks (.claude/hooks/guard.mjs) enforce
          # the hard rules in every permission mode, including this
          # one. Do NOT reuse this mode on a machine that holds
          # real secrets - locally, the settings.json allowlist is
          # the sanctioned path.
          #
          # Keep claude_args in CLI-flag STRING form. A JSON object
          # here looks like it works (model applies) while silently
          # dropping other keys - permissionMode never reaches the
          # SDK session. Flags are the action's documented contract.
          claude_args: >-
            --model claude-sonnet-5
            --permission-mode bypassPermissions
          prompt: |
            You are running <PROJECT>'s autonomous loop in CI (GitHub Actions).
            Read agents.md first for the standing rules — they all apply.

            Cloud-mode adjustments on top of agents.md:

            1. Skip interactive /oversight (it asks; nobody is here). The read-only variant is mandatory instead: END every tick — shipped, no-op, or blocked — by running /oversight audit and printing its briefing into this log, so every run closes with a state-of-the-loop snapshot.
            2. /critique MAY run when its /march gate opens, using the reader's WebFetch engine (Path B — the Chrome MCP is not available on the runner). Findings carry source: web-fetch. If bearings Auth is not "none" and no CRITIQUE_* secrets are configured in this workflow's env, run the anonymous pass only — never file auth-failed noise for a wall you knew about.
            3. /expand may run; candidates land in plan/CANDIDATES.md. Never promote from cloud unless plan/bearings.md says Promote: aged or autonomous; then /expand's aged promotion (Held line + veto issue) and /march Step 0's veto sweep run as written. Otherwise promotion happens only via local /oversight.
            4. The verify gate (`<PACKAGE_MANAGER> verify`) and deploy gate (`<PACKAGE_MANAGER> deploy:check`) are non-negotiable. Same as local. NEVER --no-verify. Run the gate FOREGROUND and wait for it — never `run_in_background`. Backgrounding the gate is the one thing that wedges this loop: the SDK ends your turn while the gate is still alive, the resume notification is unreliable here, and the run hangs with no commit. If the gate is too slow for one foreground call, run it as sequential foreground legs (each its own blocking call); do not background it. The same holds for agents: every subagent dispatch (the Agent tool, a Workflow) passes run_in_background: false explicitly. Leaving it out is a background dispatch, not a neutral default, and a backgrounded builder's work never lands: the job ends with the turn.
            5. The git author identity is already configured by the workflow via GIT_AUTHOR_*/GIT_COMMITTER_* env vars (or the action's own default if unset). Do not run git config user.* — the workflow's env vars win at commit time anyway.
            6. EVERY commit you ship in this tick MUST end with this exact trailer (a blank line before it, then the trailer as its own line):

                  Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

               This is how the next tick's ceiling check distinguishes cloud-shipped commits from the user's local work. If a commit lacks this trailer it does not count toward the cloud ceiling, which would let the loop run away. Treat the trailer as non-negotiable, like the verify gate. agents.md's "no Co-Authored-By trailers, plain commit message bodies" rule has an explicit carve-out for this single trailer; nothing else.
            7. If the tick cannot ship cleanly (red verify, red deploy, blocked phase, no work to do, anything else), do NOT half-commit. Either:
               - exit cleanly with a one-line note in the action log explaining why no work shipped this tick, or
               - if there is a real failure to surface, open a GitHub issue with `gh issue create --title "Cloud march failed: <iso-date>" --body "<context + run URL>"` and exit. Do not pass `--label` — the issue lands unlabeled and the next scheduled tick's /triage classifies and labels it appropriately.

            8. This checkout is in owner mode (an untracked .owner) and the claims session is NEXUS_SESSION (cloud-<run id>): /next claims, settles and lands on <DEFAULT_BRANCH> as the owner's checkout does.

            The dispatch order is the standard /march order from skills/march.md: triage → critique (web-fetch engine) → /next top (the chunk step: one chunk, done fully) → ship-data → expand → iterate. Issues labeled loop:do jump the queue (the concierge lane - march step 1).

            Requested verb: ${{ inputs.verb || 'march' }}. If it is not 'march', skip dispatch and execute skills/<verb>.md directly - the user asked for exactly that pass.

            Begin. One tick. One commit-and-push (or no-op). Then exit.
        env:
          # Add any secrets your verify/deploy gates need. Examples:
          # NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # VERCEL_TOKEN:       ${{ secrets.VERCEL_TOKEN }}
          # CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          #
          # Pager (playbooks/hands-off.md Step 2) — lets cloud
          # stops page your phone like local ones:
          # NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          #
          # Authenticated cloud critique (Path B), if adopted —
          # see customization/auth-aware-critique.md:
          # CRITIQUE_SESSION_COOKIE: ${{ secrets.CRITIQUE_SESSION_COOKIE }}
          #
          # Default: GITHUB_TOKEN. To switch to user-PAT mode,
          # replace with: GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This tick's claims session (scripts/claims.mjs).
          NEXUS_SESSION: cloud-${{ github.run_id }}
          # claude-code-action may not load project hooks, so claims.mjs
          # would refuse whoami/claim without this (customization/claims.md).
          NEXUS_NO_HOOK_CHECK: '1'
          #
          # Default (commented): bot-author mode, the action's own
          # identity. To switch to user-author mode, uncomment and
          # set to your username + noreply email (find your id at
          # `https://api.github.com/users/<username>`):
          # GIT_AUTHOR_NAME:     '<username>'
          # GIT_AUTHOR_EMAIL:    '<id>+<username>@users.noreply.github.com'
          # GIT_COMMITTER_NAME:  '<username>'
          # GIT_COMMITTER_EMAIL: '<id>+<username>@users.noreply.github.com'

      # The tick's own reading, from the action's execution file:
      # one summary line, the `quota` output, and the cache the next
      # run's gate reads.
      - name: Quota read
        id: quota
        if: always() && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_march.outputs.execution_file }}
        run: node scripts/cloud/quota.mjs read "$EXEC_FILE"

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      # A weekly lockout is not a crash: ONE "Loop paused: weekly
      # quota until <ISO>" issue (label loop:paused-quota), opened or
      # retitled, and no crash issue. The gate closes it after the reset.
      - name: Pause on the weekly quota
        if: always() && steps.quota.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Open cloud-failed issue if action crashed
        # Safety net for the case where Claude Code itself crashed
        # (auth error, runner OOM, etc.) before the agent could open
        # the issue per its brief. Only fires on genuine non-zero exit.
        if: failure() && steps.ceiling.outputs.skip != 'true' && steps.quota.outputs.status != 'rejected'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dedupe by title prefix instead of label — labels need
          # extra PAT scope (Issues:write at label-management level)
          # which not every PAT grants. Issue creation only needs
          # Issues:write at content level. The next /triage tick
          # labels these naturally.
          failed_step="unknown step (see run log)"
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then failed_step="Checkout (full history for /march dispatch)"; fi
          if [ "${{ steps.ceiling.outcome }}" = "failure" ]; then failed_step="Daily commit ceiling check"; fi
          if [ "${{ steps.run_march.outcome }}" = "failure" ]; then failed_step="Run /march (cloud mode)"; fi
          existing=$(gh issue list --search 'in:title "Cloud march tick crashed" state:open' --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Cloud march tick crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "Failed step: $failed_step. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "An open 'Cloud march tick crashed' issue already exists — skipping dedupe."
          fi

  # ═════════════════════════════════════════════════════════════
  # Pull-request mode (NEXUS_LOOP_MODE unset or pr): the tick is a
  # contributor. Four jobs, so the agent's job holds no token.
  # ═════════════════════════════════════════════════════════════
  pick:
    # A scheduled tick, or a dispatch asking for march or next.
    if: vars.NEXUS_LOOP_MODE != 'owner' && (inputs.verb == '' || inputs.verb == 'march' || inputs.verb == 'next')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the claims branch (scripts/claims.mjs), nothing else
      pull-requests: read    # how many loop PRs are open
      issues: write          # the quota gate reads and closes the pause issue
    outputs:
      id: ${{ steps.pick.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The quota gate, as in the owner job: nothing is claimed (so
      # nothing is built) while the weekly quota is out, or when a
      # scheduled or chained tick finds utilization at the soft cap.
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.90' }}
        run: node scripts/cloud/quota.mjs gate --event "$EVENT" --reason "$REASON" --max "$QUOTA_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # The first ready, unclaimed chunk in /next's pick order on
      # origin, claimed for this run's session (a contributor
      # named nexus-cloud). Nothing when NEXUS_PR_LIMIT loop PRs
      # (default 3) already wait on the owner.
      - name: Pick and claim one chunk
        id: pick
        if: steps.quota_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_SESSION: cloud-${{ github.run_id }}
          NEXUS_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          NEXUS_PR_LIMIT: ${{ vars.NEXUS_PR_LIMIT || '3' }}
          CHUNK: ${{ inputs.chunk }}
        run: node scripts/cloud/tick.mjs pick --chunk "$CHUNK"

  build:
    needs: pick
    if: needs.pick.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Read-only, and the agent's step gets no token at all: a
    # prompt-injected tick has nothing to push or comment with.
    permissions:
      contents: read
    outputs:
      commits: ${{ steps.bundle.outputs.commits }}
      quota_status: ${{ steps.quota.outputs.status }}
      quota_resets: ${{ steps.quota.outputs.resets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Project toolchain
        uses: ./.github/actions/setup

      # The quota reader is copied out before the agent runs, so the
      # cache the next tick trusts is never written by a script this
      # tick edited.
      - name: The tick's branch
        env:
          BRANCH: nexus/${{ github.run_id }}
        run: |
          git switch -c "$BRANCH"
          cp scripts/cloud/quota.mjs "$RUNNER_TEMP/quota.mjs"

      # The Claude Code CLI, not the action: the action fetches a
      # token of its own, and this step must hold none. Pin the
      # version (npm view @anthropic-ai/claude-code version).
      - name: Claude runs /next on the claimed chunk (no token)
        id: run_next
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CHUNK: ${{ needs.pick.outputs.id }}
          NEXUS_SESSION: cloud-${{ github.run_id }}
          NEXUS_CONTRIBUTOR: '1'
          NEXUS_NO_HOOK_CHECK: '1'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: nexus-cloud
          GIT_AUTHOR_EMAIL: nexus-cloud@users.noreply.github.com
          GIT_COMMITTER_NAME: nexus-cloud
          GIT_COMMITTER_EMAIL: nexus-cloud@users.noreply.github.com
        run: |
          {
            printf 'Chunk: %s\nRun: %s\n\n' "$CHUNK" "$RUN_URL"
            cat <<'PROMPT'
          You are running <PROJECT>'s cloud loop in pull-request mode: a
          contributor tick. Read agents.md first; its standing rules apply.

          Run /next on the chunk named above: read skills/next.md and do Steps
          0-4 and 6 for that chunk, with these changes.

          1. The workflow already holds this chunk's claim (the session in
             NEXUS_SESSION) and will push, open the pull request and attach
             it to the claim. Skip every claims.mjs call, the announce board,
             settle, and Step 5. Skip git fetch and git pull too: this
             checkout is fresh and holds no credential. Never push: you hold
             no token, so a push or a gh write fails anyway.
          2. Build in this checkout, on the current branch (nexus/<run id>).
             It is a disposable runner checkout, not a person's primary one:
             do not cut a worktree.
          3. You are a contributor: never edit a shared plan file (a spec's
             chunk list, plan/README.md, plan/ARCHIVE.md, identity/). Close
             with plan/pending/<chunk>.md (skills/next/land.md section 2). A
             new spec file is the one plan file you may add. The land job
             refuses the diff otherwise.
          4. The verify gate (<PACKAGE_MANAGER> verify) runs FOREGROUND, never
             run_in_background. Every subagent dispatch (the Agent tool, a
             Workflow) passes run_in_background: false: leaving it out is a
             background dispatch, and the job ends with your turn.
          5. Never ask: take the default, and list each default taken in the
             close's commit body, one line each.
          6. Every commit ends with the trailer (blank line before it):
               Cloud-Run: <the Run URL above>
          7. Gate red three times on one root cause, or the chunk is not
             buildable: commit nothing more, say why in one line, and exit.
             The workflow releases the claim when no commit is left.

          Begin. One chunk. Commits on this branch, then exit.
          PROMPT
          } > "$RUNNER_TEMP/prompt.txt"
          npx --yes @anthropic-ai/claude-code@2.1.285 -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --model claude-sonnet-5 \
            --permission-mode bypassPermissions \
            --strict-mcp-config \
            --output-format stream-json --verbose > "$RUNNER_TEMP/claude.jsonl" || echo "claude exited non-zero; the bundle step takes what it committed"
          node -e "let r={};for(const l of require('fs').readFileSync(process.env.RUNNER_TEMP+'/claude.jsonl','utf8').split('\n')){try{const o=JSON.parse(l);if(o.type==='result')r=o}catch{}}console.log('tick:', r.subtype ?? '', 'turns', r.num_turns ?? '?', '|', String(r.result ?? '').slice(-400))" || true

      # stream-json carries the rate_limit_event the quota reader
      # takes: the summary line, and the cache the next tick's gate
      # reads. The quota job opens the pause issue on a lockout.
      - name: Quota read
        id: quota
        if: always()
        run: node "$RUNNER_TEMP/quota.mjs" read "$RUNNER_TEMP/claude.jsonl" --cache .nexus/quota.json

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      # Only commits travel: an uncommitted edit stays on the runner.
      - name: Bundle the tick's commits
        id: bundle
        env:
          BRANCH: nexus/${{ github.run_id }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          git status --short
          n=$(git rev-list --count "origin/$MAIN..$BRANCH")
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          echo "the tick committed $n commit(s)"
          if [ "$n" -gt 0 ]; then git bundle create "$RUNNER_TEMP/tick.bundle" "origin/$MAIN..$BRANCH"; fi

      - name: Hand the commits to the land job
        if: steps.bundle.outputs.commits != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tick-${{ github.run_id }}
          path: ${{ runner.temp }}/tick.bundle
          retention-days: 3

  land:
    needs: [pick, build]
    if: needs.build.outputs.commits != '' && needs.build.outputs.commits != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push nexus/<run id>, and the claims branch
      pull-requests: write   # open the PR
    steps:
      # The default branch's checkout stays the working tree: every
      # script below is the default branch's copy, never the tick's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: tick-${{ github.run_id }}
          path: ${{ runner.temp }}/tick

      - name: Fetch the tick's branch, then fence it
        env:
          BRANCH: nexus/${{ github.run_id }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q "$RUNNER_TEMP/tick/tick.bundle" "$BRANCH:$BRANCH"
          node scripts/cloud/tick.mjs fence "origin/$MAIN" "$BRANCH"

      # Optional: a GitHub App (Contents + Pull requests on this
      # repo) so the PR's checks run on its push; the workflow's own
      # token opens PRs whose checks never start. Minted only now,
      # after the agent's job has ended and the fence has passed.
      - name: The loop's app token
        id: app
        if: vars.NEXUS_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NEXUS_APP_ID }}
          private-key: ${{ secrets.NEXUS_APP_PRIVATE_KEY }}

      - name: Push, open the PR, attach it to the claim
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: nexus/${{ github.run_id }}
          CHUNK: ${{ needs.pick.outputs.id }}
          NEXUS_SESSION: cloud-${{ github.run_id }}
          NEXUS_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          node scripts/cloud/tick.mjs land "$BRANCH" --chunk "$CHUNK"

  release:
    needs: [pick, build, land]
    # A claim with nothing behind it goes back: the build failed or
    # committed nothing, or the land failed before the PR existed.
    if: >-
      always() && needs.pick.outputs.id != '' &&
      (needs.build.result != 'success' || needs.build.outputs.commits == '0' || needs.land.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # the claims branch
      issues: write          # the crash alarm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release the claim
        env:
          CHUNK: ${{ needs.pick.outputs.id }}
          NEXUS_SESSION: cloud-${{ github.run_id }}
        run: node scripts/cloud/tick.mjs release "$CHUNK"

      - name: Open cloud-failed issue if a job crashed
        if: (needs.build.result == 'failure' || needs.land.result == 'failure') && needs.build.outputs.quota_status != 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --search 'in:title "Cloud march tick crashed" state:open' --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Cloud march tick crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "A pull-request-mode tick failed (the land job's fence names any path it refused). Run: $RUN_URL"
          fi

  # A weekly lockout is not a crash: ONE pause issue, no crash issue
  # (release's crash step stands down on a rejected reading). Its own
  # job, so the pause opens whether the tick landed work, released its
  # claim, or failed releasing it.
  quota:
    needs: [build]
    if: always() && needs.build.outputs.quota_status == 'rejected'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write          # the pause issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pause on the weekly quota
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ needs.build.outputs.quota_resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"
