name: pr-flow
run-name: pr-flow ${{ github.event.action }} PR ${{ github.event.pull_request.number }}

# A pull request's claims (scripts/claims.mjs): when a PR closes,
# merged or not, every claim carrying it leaves the claims branch
# (`claims prune` asks GitHub for each PR'd claim's state). That
# covers the cloud loop's PRs and every contributor's alike; the
# owner's settle folds a merged PR's pending files in afterwards.
#
# pull_request_target runs this file from the default branch with
# a write token, and never checks out the PR's code: it reads only
# the default branch's scripts. Hosted runner (a token is held).

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: pr-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # the claims branch
      pull-requests: read    # each PR'd claim's state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release the closed PR's claims
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: nexus-claims
          GIT_AUTHOR_EMAIL: nexus-claims@users.noreply.github.com
          GIT_COMMITTER_NAME: nexus-claims
          GIT_COMMITTER_EMAIL: nexus-claims@users.noreply.github.com
        run: node scripts/claims.mjs prune
