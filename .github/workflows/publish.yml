name: publish

# Publishes packages/cli as @usenexus/cli via npm Trusted Publishing
# (OIDC). No NPM_TOKEN: npm trusts this workflow file for
# daretodave/nexus and adds provenance automatically.
# Release: bump packages/cli/package.json, land it, then push an
# annotated tag cli-v<version>.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Pinned to the npm that did the first trusted publish (cli-v0.0.2);
      # trusted publishing needs >= 11.5.1. Bump deliberately, never @latest.
      - name: npm (pinned, trusted publishing)
        run: npm install -g npm@12.2.0 && npm --version
      - name: manual runs publish from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "workflow_dispatch from $GITHUB_REF; publish only from main or a cli-v* tag"
          exit 1
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        working-directory: packages/cli
        run: |
          want="${GITHUB_REF_NAME#cli-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $have"
            exit 1
          fi
      - name: install
        working-directory: packages/cli
        run: npm ci
      - name: test
        working-directory: packages/cli
        run: npm test
      - name: build (prebuilt UI ships in dist/)
        working-directory: packages/cli
        run: npm run build
      - name: publish
        working-directory: packages/cli
        # A prerelease version (x.y.z-pre) goes to the `next` dist-tag so
        # it never becomes `latest` for `npx @usenexus/cli`.
        run: |
          v="$(node -p "require('./package.json').version")"
          case "$v" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
