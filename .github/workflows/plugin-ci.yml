name: plugin-ci

# plugin/'s claude plugin eval suite (plugin/evals/) exercises the
# three plugin commands -- adopt, upgrade, doctor -- against scratch
# fixtures, scored and gated alongside node scripts/verify.mjs's
# plugin leg (the generator's own byte-diff): the byte-diff runs
# first, before the eval spends any money, and both must be green.
# See playbooks/plugin.md for how to read a report locally.

on:
  push:
    branches: [main]
    paths: ['plugin/**', 'scripts/build-plugin.mjs', 'prompts/adopt.md', 'prompts/upgrade.md', 'prompts/doctor.md', 'scripts/plugin-doctor.mjs', '.github/workflows/plugin-ci.yml']
  pull_request:
    paths: ['plugin/**', 'scripts/build-plugin.mjs', 'prompts/adopt.md', 'prompts/upgrade.md', 'prompts/doctor.md', 'scripts/plugin-doctor.mjs', '.github/workflows/plugin-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    # Model calls (the eval suite itself) are slower than the other
    # CI jobs in this repo; the byte-diff leg alone is seconds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/verify.mjs plugin
      - name: check for the token
        id: token_check
        # `secrets` has no named-value in an `if:` expression --
        # GitHub rejects the whole workflow file at parse time
        # (confirmed via `gh workflow run`: "Unrecognized named-value:
        # 'secrets'"), not just the one step -- and the gate's own
        # workflows leg refuses a job-level env that reads secrets
        # ("put the secret on the step that needs it"). So read it
        # once, here, on its own step, and hand every later `if:` a
        # plain step output instead.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "has_token=$([ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: install the claude CLI
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        # The documented, recommended native install for macOS/Linux/WSL
        # (https://code.claude.com/docs/en/setup#install-claude-code) --
        # same installer this repo's own dev sandbox uses. Verified
        # working end to end (fresh $HOME, `claude --version` after) at
        # chunk 67.4 build time, 2026-11-21.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the eval sandbox backend
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        # Each case grants Bash, which the CLI refuses to run
        # unconfined: it needs bubblewrap and socat on Linux
        # (https://code.claude.com/docs/en/sandboxing). The first
        # real run on ubuntu-latest (44915648905) proved socat is
        # not preinstalled there -- every case failed in 5s with
        # "sandbox required but unavailable: socat not installed",
        # at near-zero cost (no case ever reached a real agent turn).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
      - name: claude plugin eval
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        working-directory: plugin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude plugin eval . --trust-plugin --no-publish --ablation none \
            --model claude-haiku-5-5 --judge-model claude-haiku-5-5 \
            --threshold 0.8 --max-cost-usd 2 \
            --allow-tools Bash Write Edit \
            --json results.json
      - name: no CLAUDE_CODE_OAUTH_TOKEN -- eval skipped
        if: ${{ steps.token_check.outputs.has_token != 'true' }}
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set (expected on a fork pull request, which never receives repo secrets) -- skipping claude plugin eval. The byte-diff leg (node scripts/verify.mjs plugin) above already ran and still gates this workflow."
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.token_check.outputs.has_token == 'true' }}
        with:
          name: plugin-eval-results
          path: plugin/results.json
