name: plugin-ci

# plugin/'s claude plugin eval suite (plugin/evals/) exercises the
# three plugin commands -- adopt, upgrade, doctor -- against scratch
# fixtures, scored and gated alongside node scripts/verify.mjs's
# plugin leg (the generator's own byte-diff): the byte-diff runs
# first, before the eval spends any money, and both must be green.
# See playbooks/plugin.md for how to read a report locally.

on:
  push:
    branches: [main]
    paths: ['plugin/**', 'scripts/build-plugin.mjs', 'prompts/adopt.md', 'prompts/upgrade.md', 'prompts/doctor.md', 'scripts/plugin-doctor.mjs', '.github/workflows/plugin-ci.yml']
  pull_request:
    paths: ['plugin/**', 'scripts/build-plugin.mjs', 'prompts/adopt.md', 'prompts/upgrade.md', 'prompts/doctor.md', 'scripts/plugin-doctor.mjs', '.github/workflows/plugin-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    # Model calls (the eval suite itself) are slower than the other
    # CI jobs in this repo; the byte-diff leg alone is seconds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/verify.mjs plugin
      - name: check for the token
        id: token_check
        # `secrets` has no named-value in an `if:` expression --
        # GitHub rejects the whole workflow file at parse time
        # (confirmed via `gh workflow run`: "Unrecognized named-value:
        # 'secrets'"), not just the one step -- and the gate's own
        # workflows leg refuses a job-level env that reads secrets
        # ("put the secret on the step that needs it"). So read it
        # once, here, on its own step, and hand every later `if:` a
        # plain step output instead.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "has_token=$([ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: install the claude CLI
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        # The documented, recommended native install for macOS/Linux/WSL
        # (https://code.claude.com/docs/en/setup#install-claude-code) --
        # same installer this repo's own dev sandbox uses. Verified
        # working end to end (fresh $HOME, `claude --version` after) at
        # chunk 67.4 build time, 2026-11-21.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install the eval sandbox backend
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        # Each case grants Bash, which the CLI refuses to run
        # unconfined: it needs bubblewrap and socat on Linux
        # (https://code.claude.com/docs/en/sandboxing). The first
        # real run on ubuntu-latest (44915648905) proved socat is
        # not preinstalled there -- every case failed in 5s with
        # "sandbox required but unavailable: socat not installed",
        # at near-zero cost (no case ever reached a real agent turn).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          # bubblewrap's sandbox needs an unprivileged user namespace,
          # which Ubuntu 24.04 (ubuntu-latest) refuses by default via
          # AppArmor since 23.10. The second real run (44915855413)
          # proved it: every case's Bash call failed with
          # "apply-seccomp: write /proc/self/setgroups (nested userns
          # is capability-restricted...)", so the agent fell back to
          # reasoning about the task by hand instead of running it --
          # every grader failed, 0 cost beyond a few cheap turns.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The third real run (44916279206) proved that alone isn't
          # enough: the same sandbox call still failed, now with a
          # plain "Permission denied" on /proc/self/setgroups -- the
          # other classic unprivileged-userns gate (older than the
          # AppArmor one above, and independently enforced).
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # Three real runs (see #126) proved bubblewrap+socat and the
          # two sysctls above aren't enough on their own -- the CLI's
          # own sandbox-arming path still refuses to start. This
          # preflight line makes the OS-level signal visible for free.
          echo "--- sandbox preflight: can an unprivileged user namespace start? ---"
          bwrap --unshare-user --uid 0 --gid 0 --bind / / echo "bwrap: ok" || echo "bwrap: FAILED ($?)"
          unshare --user --map-root-user id || echo "unshare: FAILED ($?)"
          # A fourth real run (44918519698) proved the preflight above
          # now succeeds (bwrap and unshare both arm cleanly) while
          # every eval case still failed with the exact same
          # apply-seccomp/setgroups error -- because each case runs its
          # agent in its own scratch $HOME (/tmp/claude-eval-*/home/),
          # so a settings.json written to this step's real ~/.claude
          # (tried that run) never reaches it. The eval harness still
          # reads --settings given to the `claude plugin eval` process
          # itself, so the lever goes on that command line instead of a
          # settings file -- never a project-level settings file either
          # way (code.claude.com/docs/en/sandboxing, "User namespaces on
          # Linux and WSL2": allowNestedUserNamespaces turns off a
          # security boundary, acceptable here only because this job's
          # runner is itself the disposable, single-purpose isolation
          # boundary).
      - name: claude plugin eval
        if: ${{ steps.token_check.outputs.has_token == 'true' }}
        working-directory: plugin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --settings '{"sandbox":{"allowNestedUserNamespaces":true}}' \
            plugin eval . --trust-plugin --no-publish --ablation none \
            --model claude-haiku-5-5 --judge-model claude-haiku-5-5 \
            --threshold 0.8 --max-cost-usd 2 \
            --allow-tools Bash Write Edit \
            --json results.json
      - name: no CLAUDE_CODE_OAUTH_TOKEN -- eval skipped
        if: ${{ steps.token_check.outputs.has_token != 'true' }}
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set (expected on a fork pull request, which never receives repo secrets) -- skipping claude plugin eval. The byte-diff leg (node scripts/verify.mjs plugin) above already ran and still gates this workflow."
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.token_check.outputs.has_token == 'true' }}
        with:
          name: plugin-eval-results
          path: plugin/results.json
