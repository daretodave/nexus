name: march

# The ouroboros: nexus's own autonomous loop. One scheduled
# invocation = one /march tick on the kit that teaches /march.
# State of truth is origin/main; every tick reads it fresh.
#
# See .github/CLOUD_LOOP.md for setup (two secrets), pausing,
# and debugging. The generic template this instantiates lives
# at templates/.github/workflows/march.yml (its owner mode:
# nexus's cloud loop pushes main, as the owner's checkout does).
#
# The plan is chunks (concepts/plan-shape.md): a tick's chunk
# step is /next top -- one chunk claimed as cloud-<run_id>,
# built by a foreground builder, gated, closed with a pending
# file, settled and pushed. The owner pauses this workflow with
# gh workflow disable march; editing this file never re-arms it.
#
# nexus is a kit plus a GUI (packages/cli, @usenexus/cli). A tick
# installs and builds the CLI so it can gate a packages/cli diff
# with the CLI's own tests and walk its demo screens
# (npm run walk). The kit's own gate stays zero-dependency.

# The verb and the reason in every run's title (spec 54): the nudge
# counts its event ticks by the `issue-` reason it dispatches with.
run-name: march ${{ inputs.verb || 'march' }} ${{ inputs.reason }}

on:
  schedule:
    # The eager preset (NEXUS_CADENCE=eager; cadence.mjs apply
    # writes this line): every 3h at :17, off the busy top of the
    # hour, chaining while work is ready, behind the quota governor
    # (NEXUS_QUOTA_MAX 0.80: nexus yields first). GH cron is UTC.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      verb:
        description: 'Concierge lane: run this verb instead of dispatching'
        required: false
        type: choice
        default: march
        options: [march, next, critique, iterate, expand, triage, digest]
      # Why this run was dispatched (spec 54): `issue-<n>` from the
      # nudge, `chain` from a chained tick, empty by hand. Shown in
      # the run name; read by the quota gate and the idle probe
      # through env, never inlined into a script or the prompt.
      reason:
        description: 'Why this run was dispatched (issue-<n>, chain; empty by hand)'
        required: false
        type: string
        default: ''
      # How deep in a chain this run is (spec 55): 0 by hand or on a
      # schedule; the Chain next tick step dispatches the next run with
      # chain=<this + 1>, never past the chain max (NEXUS_CHAIN_MAX,
      # else the NEXUS_CADENCE preset's).
      chain:
        description: 'Chain depth (0 by hand; set by the Chain next tick step)'
        required: false
        type: number
        default: 0
      # Spec 55.6: does claude-code-action load this repo's .claude
      # hooks? With this set, guard.mjs logs its first call to
      # $RUNNER_TEMP/hook-probe.log and the Hook probe report step
      # says whether the file exists. The tick itself runs as usual.
      hook_probe:
        description: 'Hook probe: report whether .claude hooks loaded in this tick'
        required: false
        type: boolean
        default: false

concurrency:
  group: march
  cancel-in-progress: false

jobs:
  march:
    runs-on: ubuntu-latest
    # A tick is the CLI install (about a minute) plus one verb;
    # an hour is generous headroom.
    timeout-minutes: 60
    permissions:
      contents: write   # push to main
      issues: write     # /triage labels + mirrors + crash issue
      id-token: write   # Claude Code Action OIDC
      actions: write    # the dispatch ceiling counts workflow_dispatch runs; the chain step dispatches
    steps:
      - name: Checkout (full history for /march dispatch)
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so pushes land as the nexus
          # author, not github-actions[bot]. User-author mode per
          # CLOUD_LOOP.md "Identity choice".
          token: ${{ secrets.ACTIONS_PAT }}

      # Node 24, cli-ci's runtime. The kit's own scripts need no
      # install; the verify gate still runs bare:
      # node scripts/verify.mjs
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The cadence (templates/scripts/cloud/cadence.mjs, run in place):
      # the repo variable NEXUS_CADENCE (calm | steady | eager | sprint |
      # off) sets the 24h ceiling, the chain depth and the idle backoff
      # at run time, with no file edit; a per-field variable
      # (NEXUS_DAILY_CEILING, NEXUS_CHAIN_MAX, NEXUS_IDLE_BACKOFF)
      # overrides its preset. Unset, the improvement dial's cadence
      # stands in (an `Improve:` line other than gentle in
      # plan/bearings.md; scripts/plan/improve.mjs --cloud Cadence).
      # With neither, the ceiling literal below and the
      # scripts' defaults stand, and nothing chains. The cron line is
      # the one thing it cannot change (cadence.mjs apply writes it).
      - name: Cadence
        id: cadence
        env:
          CADENCE: ${{ vars.NEXUS_CADENCE }}
          CEILING: ${{ vars.NEXUS_DAILY_CEILING }}
          CHAIN_MAX: ${{ vars.NEXUS_CHAIN_MAX }}
          IDLE_BACKOFF: ${{ vars.NEXUS_IDLE_BACKOFF }}
        run: node templates/scripts/cloud/cadence.mjs resolve --cadence "$CADENCE" --dial "$(node scripts/plan/improve.mjs --cloud Cadence)" --ceiling "$CEILING" --chain-max "$CHAIN_MAX" --idle-backoff "$IDLE_BACKOFF" || true

      - name: Daily commit ceiling check
        id: ceiling
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_MAX: ${{ vars.NEXUS_DISPATCH_MAX || '12' }}
          CADENCE_CEILING: ${{ steps.cadence.outputs.ceiling }}
        run: |
          # Cloud commits are identified by the `Cloud-Run:` trailer
          # the agent appends to every commit message (the brief
          # mandates it). The ceiling bounds *cloud volume* in 24h —
          # local commits don't count toward it.
          #
          # The count is weighted, not flat: a chunk-shipping commit
          # (ship-a-chunk — new docs, templates, a gate leg) costs more
          # runway than a churn commit (iterate/critique/triage/digest
          # — one finding, one file). Discriminator: does the commit
          # add a line to plan/ARCHIVE.md? That's the one thing only
          # a chunk close (ship-a-chunk Step 6) does.
          since="$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S')"
          ceiling=20
          # A set NEXUS_CADENCE or NEXUS_DAILY_CEILING wins over the literal.
          if [ -n "$CADENCE_CEILING" ]; then ceiling=$CADENCE_CEILING; fi
          budget=0
          # The trailer line only (^Cloud-Run: <run url>): a message that
          # mentions the trailer in prose is not a cloud commit.
          for sha in $(git log --since="$since" -E --grep='^Cloud-Run: https?://' --format='%H'); do
            if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qx 'plan/ARCHIVE.md' \
               && git show "$sha" -- plan/ARCHIVE.md | grep -q '^+- '; then
              budget=$((budget + 3))   # chunk-shipping commit
            else
              budget=$((budget + 1))   # churn commit
            fi
          done
          echo "Cloud-shipped weighted budget in last 24h: $budget / $ceiling (chunk=3, churn=1)"
          # The chain step counts the budget again after the tick, against this ceiling.
          echo "ceiling=$ceiling" >> "$GITHUB_OUTPUT"
          if [ "$budget" -ge "$ceiling" ]; then
            echo "Cloud ceiling reached ($ceiling weighted budget/24h). Exiting cleanly — no work this tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=the 24h cloud commit budget is spent" >> "$GITHUB_OUTPUT"
          else
            # The dispatch ceiling (spec 54): a dispatched run exits
            # cleanly once NEXUS_DISPATCH_MAX (12) workflow_dispatch
            # runs of any workflow started here in 24h. It bounds a
            # tick that dispatches runs itself (a prompt-injected gh
            # workflow run), nudges and chained runs; a run that ships
            # nothing is invisible to the commit count above. Fails open.
            node templates/scripts/cloud/quota.mjs dispatch --event "$EVENT" --run-id "$GITHUB_RUN_ID" --max "$DISPATCH_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The quota governor (templates/scripts/cloud/quota.mjs, the
      # template's copy run in place): every loop on the
      # subscription shares one seven_day window. The newest reading
      # any march or night run cached comes back first.
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      # Skips the model (a clean exit) while the pause issue's reset
      # is ahead; for every tick (support, loop:do and hand-dispatched
      # ones included) at or above the hard ceiling, 0.97 seven_day
      # utilization, a constant; and, for a scheduled or chained tick,
      # when the cached utilization is at or above NEXUS_QUOTA_MAX
      # (`off` disables that soft cap; nexus yields first at 0.80).
      # Fails open.
      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.80' }}
        run: node templates/scripts/cloud/quota.mjs gate --event "$EVENT" --reason "$REASON" --max "$QUOTA_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # The idle probe (templates/scripts/cloud/idle.mjs, spec 55): a
      # scheduled tick that finds the repo as the last no-op left it
      # (origin/main sha, open issue counts by label, the ready count,
      # the newest issue update; counts and hashes, never issue text)
      # after the idle backoff's count of scheduled no-ops
      # (NEXUS_IDLE_BACKOFF, else the cadence's, else 3), nothing ready,
      # exits before the model. Every NEXUS_IDLE_WAKE_EVERYth skip runs
      # anyway; dispatch, nudge and chain runs never skip. Fails open.
      - name: Idle cache restore
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .nexus/idle.json
          key: nexus-idle-${{ github.run_id }}
          restore-keys: nexus-idle-

      - name: Idle probe
        id: idle
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          BACKOFF: ${{ steps.cadence.outputs.idle_backoff }}
          WAKE_EVERY: ${{ vars.NEXUS_IDLE_WAKE_EVERY }}
        run: node templates/scripts/cloud/idle.mjs probe --event "$EVENT" --reason "$REASON" --main main --backoff "$BACKOFF" --wake-every "$WAKE_EVERY" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # The runner's checkout is the owner's for this tick: the
      # untracked .owner (gitignored) makes scripts/claims.mjs
      # claim as privileged_agent_session, scripts/plan/settle.mjs
      # settle and the push policy pass main (playbooks/owner-mode.md).
      - name: Owner mode for this checkout
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true' && steps.idle.outputs.skip != 'true'
        run: touch .owner

      # The CLI gate (spec 56): install and build packages/cli so a
      # tick can run its tests and walk its demo screens. On while
      # the repo variable NEXUS_CLI_GATE is unset or '1'; '0' leaves
      # packages/cli findings for a local session (the stop switch
      # if a tick ever commits a red CLI, no workflow edit needed).
      # --ignore-scripts: checkout leaves ACTIONS_PAT in .git/config,
      # and a dependency's lifecycle script could read it (the only
      # install script in the lockfile is fsevents, macOS only). A
      # failed install or build turns the gate off for this tick
      # (the model step reads the outcome) instead of failing it;
      # cli-ci, which the heartbeat watches, reports a red CLI.
      # The npm cache is keyed on the CLI's lockfile, and restored
      # only on a tick that installs (a skipped tick saves nothing).
      - name: CLI npm cache
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true' && steps.idle.outputs.skip != 'true' && (vars.NEXUS_CLI_GATE || '1') == '1'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: nexus-cli-npm-${{ hashFiles('packages/cli/package-lock.json') }}
          restore-keys: nexus-cli-npm-

      - name: Install and build the CLI
        id: cli_build
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true' && steps.idle.outputs.skip != 'true' && (vars.NEXUS_CLI_GATE || '1') == '1'
        continue-on-error: true
        working-directory: packages/cli
        run: |
          npm ci --ignore-scripts
          npm run build

      # Git author identity is set via GIT_AUTHOR_* /
      # GIT_COMMITTER_* env vars on the action step below, NOT via
      # `git config`: the action runs its own internal git config
      # after workflow steps, so repo-local config gets silently
      # overridden. Env vars win at commit time (pattern proven on
      # a sibling loop, ../shows).

      - name: Run /march (cloud mode)
        id: run_march
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true' && steps.idle.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Always-on transcript: the operator manual's "read the
          # closing /oversight audit block" is impossible without
          # it, and a no-op tick must say why it no-op'd. Public
          # docs repo; runner masks the tokens.
          show_full_output: 'true'
          # --permission-mode bypassPermissions: there is no human
          # on this runner to approve prompts, and default mode
          # turned ticks 1-3 into read-only sightseeing ("This
          # command requires approval" x many). The runner is a
          # disposable, repo-scoped container - the kit's
          # sanctioned bypass context. claude-code-action does load
          # the project's .claude hooks (spec 55.6: a hook_probe tick,
          # run 40254359071, logged guard.mjs firing), so
          # .claude/hooks/guard.mjs runs here in every permission mode,
          # bypass included. The brief's rules, the gate and the
          # token's blast radius (this repo) still hold on their own.
          #
          # CLI-flag STRING form, not JSON: tick 3 proved the JSON
          # key "permissionMode" is dropped on the way to the SDK
          # session (model survived; permission mode stayed
          # "default"). Flags are the action's documented contract.
          claude_args: >-
            --model claude-sonnet-5
            --permission-mode bypassPermissions
          prompt: |
            You are running nexus's autonomous loop in CI. This repo IS the
            methodology kit — the loop you are executing is the loop the kit
            teaches, applied to itself. Read agents.md first; its standing
            rules all apply.

            Cloud-mode adjustments on top of agents.md:

            1. Skip interactive /oversight. END every tick — shipped, no-op,
               or blocked — by running /oversight audit (read-only) and
               printing its briefing into this log.
            2. /critique MAY run when its gate opens: the dry-run adoption
               needs only files and mktemp, both available here.
            3. /expand may run; candidates land in plan/CANDIDATES.md.
               Never promote from cloud unless plan/bearings.md says
               Promote: aged or autonomous; then /expand's aged promotion
               (Held line + veto issue) and march Step 0's veto sweep run
               as written.
            4. The verify gate (node scripts/verify.mjs) is non-negotiable
               and runs FOREGROUND — never run_in_background. There is no
               deploy gate (agents.md rule 4): the push is the deploy.
            5. Every subagent dispatch (the Agent tool, a Workflow) passes
               run_in_background: false explicitly. Leaving it out is a
               background dispatch, not a neutral default: the job is a
               single-shot process, so the tick would end its turn, exit
               clean, and the builder's work would never land.
            6. This checkout is in owner mode (.owner, untracked) and the
               claims session is NEXUS_SESSION (cloud-<run id>): /next
               claims, settles and lands on main as the owner does.
            7. The git author is already configured via GIT_AUTHOR_* /
               GIT_COMMITTER_* env vars. Do not run git config user.* —
               the env vars win at commit time anyway.
            8. EVERY commit you ship this tick MUST end with this exact
               trailer (blank line before it, trailer on its own line):

                  Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

               This is how the ceiling counts cloud commits. agents.md rule 2
               has an explicit carve-out for this single trailer.
            9. If the tick cannot ship cleanly, do NOT half-commit: exit with
               a one-line note in this log, or open an unlabeled issue via
               gh issue create (the next /triage classifies it). Every issue
               this tick opens, for any reason, carries this line in its
               body (the loop-filed marker, so no issue the loop files
               starts another tick):

                  Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

               and never --label bug, loop:do or any urgent label (triage
               still classifies it later).
            10. The CLI gate is ${{ steps.cli_build.outcome == 'success' && 'ON' || 'OFF' }} this tick (NEXUS_CLI_GATE in the env).
               ON: packages/cli is installed and built, and any diff
               touching packages/cli is gated by node scripts/verify.mjs
               AND npm --prefix packages/cli test (plus
               npm --prefix packages/cli run build when packages/cli/src
               changed), all FOREGROUND and green in this log before its
               commit. npm --prefix packages/cli run walk writes
               .scratch/walk/<iso>/ (walk.json and PNGs), uploaded as the
               run artifact walk-${{ github.run_id }}: cite it, and never
               commit a screenshot. OFF: leave packages/cli findings for a
               local session. Either way, never bump the CLI's version and
               never tag cli-v*: the owner releases.

            Dispatch order per skills/march.md: triage → critique →
            /next top (the chunk step: one chunk, done fully) → expand →
            iterate. Issues labeled loop:do jump the queue (march step 1 -
            the concierge lane).

            Requested verb: ${{ inputs.verb || 'march' }}. If it is not
            'march', skip dispatch and execute skills/<verb>.md directly -
            the user asked for exactly that pass.

            Begin. One tick. One commit-and-push (or clean no-op). Then the
            /oversight audit briefing. Then exit.
        env:
          # ACTIONS_PAT (not GITHUB_TOKEN) so the agent's gh calls
          # and pushes identify as the nexus author, not the bot.
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          # This tick's claims session (scripts/claims.mjs).
          NEXUS_SESSION: cloud-${{ github.run_id }}
          # Hooks load in cloud (spec 55.6), but claims.mjs's check
          # wants the guard's per-session marker under .nexus/hooks,
          # which no cloud tick has yet been seen to leave; until one
          # does, this skips that check (customization/claims.md).
          NEXUS_NO_HOOK_CHECK: '1'
          # The hook probe (spec 55.6): '1' only on a dispatch with
          # hook_probe=true; guard.mjs ignores anything else.
          NEXUS_HOOK_PROBE: ${{ inputs.hook_probe && '1' || '' }}
          # Prompt rule 10's switch: '1' only when the CLI installed
          # and built this tick (the repo variable NEXUS_CLI_GATE
          # unset or '1', and the step green).
          NEXUS_CLI_GATE: ${{ steps.cli_build.outcome == 'success' && '1' || '0' }}
          # The support lane (spec 54): the repo variables win over
          # bearings' Support line; unset reads bearings.
          NEXUS_SUPPORT: ${{ vars.NEXUS_SUPPORT }}
          NEXUS_SUPPORT_TRUST: ${{ vars.NEXUS_SUPPORT_TRUST }}
          # Author identity: display name "nexus", attributed to the
          # PAT's account via its noreply email. The Cloud-Run:
          # trailer (not the author) is the ceiling discriminator,
          # so uniform authorship stays safe.
          GIT_AUTHOR_NAME:     'nexus'
          GIT_AUTHOR_EMAIL:    '7341502+daretodave@users.noreply.github.com'
          GIT_COMMITTER_NAME:  'nexus'
          GIT_COMMITTER_EMAIL: '7341502+daretodave@users.noreply.github.com'

      # The walk's screenshots leave as a run artifact, never as a
      # commit; a tick that did not walk uploads nothing.
      - name: Upload the walk
        if: always() && steps.cli_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: walk-${{ github.run_id }}
          path: .scratch/walk/**
          # .scratch is a dot folder, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      # Spec 55.6's answer, in the log and the step summary:
      # scripts/cloud/probe-latency.mjs report --hook-run <id> reads it.
      - name: Hook probe report
        # Only when the model step ran: a ceiling or quota skip is no answer.
        if: always() && inputs.hook_probe && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        run: |
          # gh run view --log prints this script in the step header,
          # so the answer goes out behind a marker the script only
          # ever spells followed by shell text, which the reader skips.
          log="$RUNNER_TEMP/hook-probe.log"
          if [ -f "$log" ]; then
            line="hooks loaded ($(head -n 1 "$log"))"
          else
            line="no hook call reached guard.mjs (project hooks did not load)"
          fi
          echo "HOOK_PROBE_RESULT=$line"
          echo "hook probe: $line" >> "$GITHUB_STEP_SUMMARY"

      # The tick's own reading, from the action's execution file:
      # one summary line, the `quota` output, and the cache the next
      # run's gate reads.
      - name: Quota read
        id: quota
        if: always() && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_march.outputs.execution_file }}
        run: node templates/scripts/cloud/quota.mjs read "$EXEC_FILE"

      # The lost-to-background mark (spec 55): a result that defers to
      # background work, with no commit carrying this run's Cloud-Run
      # trailer, is marked in the step summary and the `lost` output.
      # guard.mjs denies background calls in CI (hooks load there,
      # spec 55.6); this check is the second line behind it.
      - name: Lost-to-background check
        id: lost
        if: always() && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_march.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node templates/scripts/cloud/lost.mjs check "$EXEC_FILE" --run-url "$RUN_URL" --fetch main

      # The idle probe's other half: whether this run landed a
      # Cloud-Run commit, and the fingerprint it left (a scheduled
      # no-op adds one to the count the next probe reads).
      - name: Idle record
        id: idle_record
        if: always() && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node templates/scripts/cloud/idle.mjs record --event "$EVENT" --reason "$REASON" --main main --run-url "$RUN_URL"

      - name: Idle cache save
        if: always() && hashFiles('.nexus/idle.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/idle.json
          key: nexus-idle-${{ github.run_id }}-${{ github.run_attempt }}

      # Every tick that lands nothing says why, in one step-summary
      # line: `no-op reason: <ceiling | quota | idle skip | no ready
      # work | lost-to-background | ...>`.
      - name: No-op reason
        if: always()
        env:
          LANDED: ${{ steps.idle_record.outputs.landed }}
          CEILING: ${{ steps.ceiling.outputs.skip }}
          CEILING_REASON: ${{ steps.ceiling.outputs.reason }}
          QUOTA_SKIP: ${{ steps.quota_gate.outputs.skip }}
          QUOTA_REASON: ${{ steps.quota_gate.outputs.reason }}
          IDLE_SKIP: ${{ steps.idle.outputs.skip }}
          IDLE_REASON: ${{ steps.idle.outputs.reason }}
          QUOTA_STATUS: ${{ steps.quota.outputs.status }}
          RESETS: ${{ steps.quota.outputs.resets }}
          LOST: ${{ steps.lost.outputs.lost }}
          MODEL: ${{ steps.run_march.outcome }}
          READY: ${{ steps.idle.outputs.ready }}
          EXEC_FILE: ${{ steps.run_march.outputs.execution_file }}
        run: >-
          node templates/scripts/cloud/idle.mjs noop --landed "$LANDED" --ceiling "$CEILING" --ceiling-reason "$CEILING_REASON"
          --quota-skip "$QUOTA_SKIP" --quota-reason "$QUOTA_REASON" --idle-skip "$IDLE_SKIP" --idle-reason "$IDLE_REASON"
          --quota-status "$QUOTA_STATUS" --resets "$RESETS" --lost "$LOST" --model "$MODEL" --ready "$READY" "$EXEC_FILE"

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      # A weekly lockout is not a crash: ONE "Loop paused: weekly
      # quota until <ISO>" issue (label loop:paused-quota), opened or
      # retitled, and no crash issue. The gate closes it after the reset.
      - name: Pause on the weekly quota
        if: always() && steps.quota.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node templates/scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Open cloud-failed issue if action crashed
        if: failure() && steps.ceiling.outputs.skip != 'true' && steps.quota.outputs.status != 'rejected'
        env:
          # GITHUB_TOKEN, not ACTIONS_PAT: an alarm that shares the
          # PAT's failure mode goes silent exactly when the PAT dies
          # (the 2026-08-02 outage went 21 days unreported). The
          # run's own token is minted fresh and survives it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed_step="unknown step (see run log)"
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then failed_step="Checkout (full history for /march dispatch)"; fi
          if [ "${{ steps.ceiling.outcome }}" = "failure" ]; then failed_step="Daily commit ceiling check"; fi
          if [ "${{ steps.run_march.outcome }}" = "failure" ]; then failed_step="Run /march (cloud mode)"; fi
          existing=$(gh issue list --search 'in:title "Cloud march tick crashed" state:open' --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Cloud march tick crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "Failed step: $failed_step. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "An open 'Cloud march tick crashed' issue already exists — skipping dedupe."
          fi

      # Self-chaining (templates/scripts/cloud/chain.mjs, spec 55): a
      # tick that landed a commit (or was lost to background work: one
      # retry) while work is ready dispatches the next tick now instead
      # of leaving it to the next cron slot. Every guard must hold:
      # chain + 1 at or under the chain max (NEXUS_CHAIN_MAX, else the
      # NEXUS_CADENCE preset's; both unset read as 0, so the variables
      # alone decide whether nexus chains), this run's quota
      # reading parsed and under NEXUS_QUOTA_MAX, the weighted budget
      # + 3 at or under the ceiling, no march or night run queued or
      # pending, not within 30 min of night's slot, and a ready chunk
      # or an open loop:do or unlabeled issue. Fails closed. A chained
      # run passes the same ceilings and quota gate as any run.
      - name: Chain next tick
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          LANDED: ${{ steps.idle_record.outputs.landed }}
          LOST: ${{ steps.lost.outputs.lost }}
          REASON: ${{ github.event.inputs.reason }}
          CHAIN: ${{ inputs.chain }}
          CHAIN_MAX: ${{ steps.cadence.outputs.chain_max }}
          QUOTA: ${{ steps.quota.outputs.quota }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.80' }}
          CEILING: ${{ steps.ceiling.outputs.ceiling }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: >-
          node templates/scripts/cloud/chain.mjs --landed "$LANDED" --lost "$LOST" --reason "$REASON"
          --chain "$CHAIN" --chain-max "$CHAIN_MAX" --quota "$QUOTA" --quota-max "$QUOTA_MAX"
          --ceiling "$CEILING" --main "$MAIN" --workflow march.yml --night .github/workflows/night.yml
