name: march

# The ouroboros: nexus's own autonomous loop. One scheduled
# invocation = one /march tick on the kit that teaches /march.
# State of truth is origin/main; every tick reads it fresh.
#
# See .github/CLOUD_LOOP.md for setup (two secrets), pausing,
# and debugging. The generic template this instantiates lives
# at templates/.github/workflows/march.yml (its owner mode:
# nexus's cloud loop pushes main, as the owner's checkout does).
#
# The plan is chunks (concepts/plan-shape.md): a tick's chunk
# step is /next top -- one chunk claimed as cloud-<run_id>,
# built by a foreground builder, gated, closed with a pending
# file, settled and pushed. The owner pauses this workflow with
# gh workflow disable march; editing this file never re-arms it.

on:
  schedule:
    # 4 ticks/day. A docs kit doesn't need product cadence;
    # it needs steady, reviewable motion. GH cron is UTC.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      verb:
        description: 'Concierge lane: run this verb instead of dispatching'
        required: false
        type: choice
        default: march
        options: [march, next, critique, iterate, expand, triage, digest]
      # Spec 55.6: does claude-code-action load this repo's .claude
      # hooks? With this set, guard.mjs logs its first call to
      # $RUNNER_TEMP/hook-probe.log and the Hook probe report step
      # says whether the file exists. The tick itself runs as usual.
      hook_probe:
        description: 'Hook probe: report whether .claude hooks loaded in this tick'
        required: false
        type: boolean
        default: false

concurrency:
  group: march
  cancel-in-progress: false

jobs:
  march:
    runs-on: ubuntu-latest
    # Docs ticks are fast; an hour is generous headroom.
    timeout-minutes: 60
    permissions:
      contents: write   # push to main
      issues: write     # /triage labels + mirrors + crash issue
      id-token: write   # Claude Code Action OIDC
    steps:
      - name: Checkout (full history for /march dispatch)
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so pushes land as the nexus
          # author, not github-actions[bot]. User-author mode per
          # CLOUD_LOOP.md "Identity choice".
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install step: the kit is zero-dependency by design.
      # The verify gate runs bare: node scripts/verify.mjs

      - name: Daily commit ceiling check
        id: ceiling
        run: |
          # Cloud commits are identified by the `Cloud-Run:` trailer
          # the agent appends to every commit message (the brief
          # mandates it). The ceiling bounds *cloud volume* in 24h —
          # local commits don't count toward it.
          #
          # The count is weighted, not flat: a chunk-shipping commit
          # (ship-a-chunk — new docs, templates, a gate leg) costs more
          # runway than a churn commit (iterate/critique/triage/digest
          # — one finding, one file). Discriminator: does the commit
          # add a line to plan/ARCHIVE.md? That's the one thing only
          # a chunk close (ship-a-chunk Step 6) does.
          since="$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S')"
          ceiling=20
          budget=0
          for sha in $(git log --since="$since" --grep='Cloud-Run:' --format='%H'); do
            if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qx 'plan/ARCHIVE.md' \
               && git show "$sha" -- plan/ARCHIVE.md | grep -q '^+- '; then
              budget=$((budget + 3))   # chunk-shipping commit
            else
              budget=$((budget + 1))   # churn commit
            fi
          done
          echo "Cloud-shipped weighted budget in last 24h: $budget / $ceiling (chunk=3, churn=1)"
          if [ "$budget" -ge "$ceiling" ]; then
            echo "Cloud ceiling reached ($ceiling weighted budget/24h). Exiting cleanly — no work this tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The quota governor (templates/scripts/cloud/quota.mjs, the
      # template's copy run in place): every loop on the
      # subscription shares one seven_day window. The newest reading
      # any march or night run cached comes back first.
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      # Skips the model (a clean exit) while the pause issue's reset
      # is ahead, or, for a scheduled or chained tick, when the cached
      # utilization is at or above NEXUS_QUOTA_MAX (`off` disables
      # that soft cap; nexus yields first at 0.80). Fails open.
      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.80' }}
        run: node templates/scripts/cloud/quota.mjs gate --event "$EVENT" --reason "$REASON" --max "$QUOTA_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # The runner's checkout is the owner's for this tick: the
      # untracked .owner (gitignored) makes scripts/claims.mjs
      # claim as privileged_agent_session, scripts/plan/settle.mjs
      # settle and the push policy pass main (playbooks/owner-mode.md).
      - name: Owner mode for this checkout
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        run: touch .owner

      # Git author identity is set via GIT_AUTHOR_* /
      # GIT_COMMITTER_* env vars on the action step below, NOT via
      # `git config`: the action runs its own internal git config
      # after workflow steps, so repo-local config gets silently
      # overridden. Env vars win at commit time (pattern proven on
      # a sibling loop, ../shows).

      - name: Run /march (cloud mode)
        id: run_march
        if: steps.ceiling.outputs.skip != 'true' && steps.quota_gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Always-on transcript: the operator manual's "read the
          # closing /oversight audit block" is impossible without
          # it, and a no-op tick must say why it no-op'd. Public
          # docs repo; runner masks the tokens.
          show_full_output: 'true'
          # --permission-mode bypassPermissions: there is no human
          # on this runner to approve prompts, and default mode
          # turned ticks 1-3 into read-only sightseeing ("This
          # command requires approval" x many). The runner is a
          # disposable, repo-scoped container - the kit's
          # sanctioned bypass context. Where hooks load,
          # .claude/hooks/guard.mjs runs in every permission mode,
          # bypass included; whether claude-code-action loads the
          # project's hooks at all is unverified until a tick
          # dispatched with hook_probe=true says so (spec 55.6), so
          # nothing in cloud relies on the guard: the brief's rules,
          # the gate and the token's blast radius (this repo) hold.
          #
          # CLI-flag STRING form, not JSON: tick 3 proved the JSON
          # key "permissionMode" is dropped on the way to the SDK
          # session (model survived; permission mode stayed
          # "default"). Flags are the action's documented contract.
          claude_args: >-
            --model claude-sonnet-5
            --permission-mode bypassPermissions
          prompt: |
            You are running nexus's autonomous loop in CI. This repo IS the
            methodology kit — the loop you are executing is the loop the kit
            teaches, applied to itself. Read agents.md first; its standing
            rules all apply.

            Cloud-mode adjustments on top of agents.md:

            1. Skip interactive /oversight. END every tick — shipped, no-op,
               or blocked — by running /oversight audit (read-only) and
               printing its briefing into this log.
            2. /critique MAY run when its gate opens: the dry-run adoption
               needs only files and mktemp, both available here.
            3. /expand may run; candidates land in plan/CANDIDATES.md.
               Never promote from cloud unless plan/bearings.md says
               Promote: aged or autonomous; then /expand's aged promotion
               (Held line + veto issue) and march Step 0's veto sweep run
               as written.
            4. The verify gate (node scripts/verify.mjs) is non-negotiable
               and runs FOREGROUND — never run_in_background. There is no
               deploy gate (agents.md rule 4): the push is the deploy.
            5. Every subagent dispatch (the Agent tool, a Workflow) passes
               run_in_background: false explicitly. Leaving it out is a
               background dispatch, not a neutral default: the job is a
               single-shot process, so the tick would end its turn, exit
               clean, and the builder's work would never land.
            6. This checkout is in owner mode (.owner, untracked) and the
               claims session is NEXUS_SESSION (cloud-<run id>): /next
               claims, settles and lands on main as the owner does.
            7. The git author is already configured via GIT_AUTHOR_* /
               GIT_COMMITTER_* env vars. Do not run git config user.* —
               the env vars win at commit time anyway.
            8. EVERY commit you ship this tick MUST end with this exact
               trailer (blank line before it, trailer on its own line):

                  Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

               This is how the ceiling counts cloud commits. agents.md rule 2
               has an explicit carve-out for this single trailer.
            9. If the tick cannot ship cleanly, do NOT half-commit: exit with
               a one-line note in this log, or open an unlabeled issue via
               gh issue create (the next /triage classifies it).

            Dispatch order per skills/march.md: triage → critique →
            /next top (the chunk step: one chunk, done fully) → expand →
            iterate. Issues labeled loop:do jump the queue (march step 1 -
            the concierge lane).

            Requested verb: ${{ inputs.verb || 'march' }}. If it is not
            'march', skip dispatch and execute skills/<verb>.md directly -
            the user asked for exactly that pass.

            Begin. One tick. One commit-and-push (or clean no-op). Then the
            /oversight audit briefing. Then exit.
        env:
          # ACTIONS_PAT (not GITHUB_TOKEN) so the agent's gh calls
          # and pushes identify as the nexus author, not the bot.
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          # This tick's claims session (scripts/claims.mjs).
          NEXUS_SESSION: cloud-${{ github.run_id }}
          # The same unverified question as the permission note above:
          # if claude-code-action loads no project hooks, claims.mjs
          # finds no hook marker and refuses whoami/claim, so this
          # skips that check (customization/claims.md) until the hook
          # probe settles it.
          NEXUS_NO_HOOK_CHECK: '1'
          # The hook probe (spec 55.6): '1' only on a dispatch with
          # hook_probe=true; guard.mjs ignores anything else.
          NEXUS_HOOK_PROBE: ${{ inputs.hook_probe && '1' || '' }}
          # Author identity: display name "nexus", attributed to the
          # PAT's account via its noreply email. The Cloud-Run:
          # trailer (not the author) is the ceiling discriminator,
          # so uniform authorship stays safe.
          GIT_AUTHOR_NAME:     'nexus'
          GIT_AUTHOR_EMAIL:    '7341502+daretodave@users.noreply.github.com'
          GIT_COMMITTER_NAME:  'nexus'
          GIT_COMMITTER_EMAIL: '7341502+daretodave@users.noreply.github.com'

      # Spec 55.6's answer, in the log and the step summary:
      # scripts/cloud/probe-latency.mjs report --hook-run <id> reads it.
      - name: Hook probe report
        # Only when the model step ran: a ceiling or quota skip is no answer.
        if: always() && inputs.hook_probe && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        run: |
          # gh run view --log prints this script in the step header,
          # so the answer goes out behind a marker the script only
          # ever spells followed by shell text, which the reader skips.
          log="$RUNNER_TEMP/hook-probe.log"
          if [ -f "$log" ]; then
            line="hooks loaded ($(head -n 1 "$log"))"
          else
            line="no hook call reached guard.mjs (project hooks did not load)"
          fi
          echo "HOOK_PROBE_RESULT=$line"
          echo "hook probe: $line" >> "$GITHUB_STEP_SUMMARY"

      # The tick's own reading, from the action's execution file:
      # one summary line, the `quota` output, and the cache the next
      # run's gate reads.
      - name: Quota read
        id: quota
        if: always() && (steps.run_march.outcome == 'success' || steps.run_march.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_march.outputs.execution_file }}
        run: node templates/scripts/cloud/quota.mjs read "$EXEC_FILE"

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      # A weekly lockout is not a crash: ONE "Loop paused: weekly
      # quota until <ISO>" issue (label loop:paused-quota), opened or
      # retitled, and no crash issue. The gate closes it after the reset.
      - name: Pause on the weekly quota
        if: always() && steps.quota.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node templates/scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Open cloud-failed issue if action crashed
        if: failure() && steps.ceiling.outputs.skip != 'true' && steps.quota.outputs.status != 'rejected'
        env:
          # GITHUB_TOKEN, not ACTIONS_PAT: an alarm that shares the
          # PAT's failure mode goes silent exactly when the PAT dies
          # (the 2026-08-02 outage went 21 days unreported). The
          # run's own token is minted fresh and survives it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed_step="unknown step (see run log)"
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then failed_step="Checkout (full history for /march dispatch)"; fi
          if [ "${{ steps.ceiling.outcome }}" = "failure" ]; then failed_step="Daily commit ceiling check"; fi
          if [ "${{ steps.run_march.outcome }}" = "failure" ]; then failed_step="Run /march (cloud mode)"; fi
          existing=$(gh issue list --search 'in:title "Cloud march tick crashed" state:open' --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Cloud march tick crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "Failed step: $failed_step. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "An open 'Cloud march tick crashed' issue already exists — skipping dedupe."
          fi
