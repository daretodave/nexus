name: night

# The night shift (loop shape 2): one /digest tick a day.
# Writes plan/DIGEST.md - the morning briefing - and does the
# breadth work the per-commit path must not. Runs in its own
# concurrency group (below) and lands by rebase.

on:
  schedule:
    - cron: '30 10 * * *'   # daily, ~06:30 US East
  workflow_dispatch:

concurrency:
  # Its own group, not march's: GitHub keeps one pending run per
  # group and cancels it when the next queues, so a digest waiting
  # behind a long tick was evicted by march's next cron. It writes
  # only its own files and lands by rebase (skills/next/land.md).
  group: night
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write         # the crash alarm (GITHUB_TOKEN)
      actions: read         # gh run list - the pulse
      id-token: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the digest commit lands as the nexus author —
          # same identity mode as march.yml.
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The quota governor, as in march.yml: the newest cached
      # seven_day reading, then the gate (a scheduled night run
      # honours the soft cap too). /digest prints the reading.
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.80' }}
        run: node templates/scripts/cloud/quota.mjs gate --event "$EVENT" --reason "$REASON" --max "$QUOTA_MAX" || echo "skip=false" >> "$GITHUB_OUTPUT"

      # Author identity via env vars on the action step (see
      # march.yml for why `git config` doesn't survive the action).

      - name: Run /digest (night shift)
        id: run_digest
        if: steps.quota_gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'true'
          claude_args: >-
            --model claude-sonnet-5
            --permission-mode bypassPermissions
          prompt: |
            You are nexus's night shift. Read agents.md, then execute
            skills/digest.md end to end - it is the single source of truth.

            Cloud notes: the verify gate (node scripts/verify.mjs) runs
            FOREGROUND; your one commit MUST end with the trailer

              Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            (blank line before it). Proposals never actions: gate tunings
            become plan/CANDIDATES.md candidates, nothing else. One
            commit (digest: <date>), push, exit.
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          GIT_AUTHOR_NAME:     'nexus'
          GIT_AUTHOR_EMAIL:    '7341502+daretodave@users.noreply.github.com'
          GIT_COMMITTER_NAME:  'nexus'
          GIT_COMMITTER_EMAIL: '7341502+daretodave@users.noreply.github.com'

      - name: Quota read
        id: quota
        if: always() && (steps.run_digest.outcome == 'success' || steps.run_digest.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_digest.outputs.execution_file }}
        run: node templates/scripts/cloud/quota.mjs read "$EXEC_FILE"

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pause on the weekly quota
        if: always() && steps.quota.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node templates/scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Open night-failed issue if action crashed
        if: failure() && steps.quota.outputs.status != 'rejected'
        env:
          # GITHUB_TOKEN, not ACTIONS_PAT: an alarm that shares the
          # PAT's failure mode goes silent exactly when the PAT dies
          # (the 2026-08-02 outage went 21 days unreported). The
          # run's own token is minted fresh and survives it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed_step="unknown step (see run log)"
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then failed_step="Checkout"; fi
          if [ "${{ steps.run_digest.outcome }}" = "failure" ]; then failed_step="Run /digest (night shift)"; fi
          existing=$(gh issue list --search 'in:title "Night digest crashed" state:open' --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Night digest crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "Failed step: $failed_step. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
