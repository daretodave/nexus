<title id="landing-title">How work lands</title>
<desc id="landing-desc">A built chunk with a green gate lands one of two ways: in owner mode (a .owner file) it is pushed to main; in contributor mode it becomes a pull request on next/&lt;id&gt;, reviewed and merged. Both end on origin/main.</desc>
